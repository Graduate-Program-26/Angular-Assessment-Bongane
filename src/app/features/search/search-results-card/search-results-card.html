<cdk-virtual-scroll-viewport
  [itemSize]="72"
  class="example-viewport"
  (scrolledIndexChange)="onScrolledIndexChange($event)"
>
  <nz-list>
    <nz-list-item *cdkVirtualFor="let searchItem of searchItems(); trackBy: trackById">
      <nz-list-item-meta
        [nzAvatar]="searchItem.album.cover_small"
        [nzDescription]="searchItem.artist.name"
      >
        <nz-list-item-meta-title>
          {{ searchItem.title }}
        </nz-list-item-meta-title>
      </nz-list-item-meta>
      <ul nz-list-item-actions>
        <app-search-item-actions [searchItem]="searchItem" />
      </ul>
    </nz-list-item>
    @if (isLoading()) {
      <nz-list-item>
        <nz-skeleton [nzActive]="true" [nzAvatar]="true" [nzParagraph]="{ rows: 1 }" />
      </nz-list-item>
    }
  </nz-list>
</cdk-virtual-scroll-viewport>
