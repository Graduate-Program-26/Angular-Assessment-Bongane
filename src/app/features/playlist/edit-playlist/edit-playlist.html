<section class="edit-playlist-page">
  <header class="playlist-page-header">
    <div>
      <img width="200px" height="200px" [src]="currentPlaylist()?.picture" alt="" />
    </div>
    <p class="playlist-title">{{ currentPlaylist()?.title }}</p>
  </header>

  <cdk-virtual-scroll-viewport itemSize="73" class="local-playlist-infinite-container">
    <nz-list>
      <nz-list-item *cdkVirtualFor="let track of currentPlaylist()?.tracks; trackBy: trackById">
        <ng-container>
          <nz-list-item-meta
            [nzAvatar]="track.album.cover_small"
            [nzDescription]="`${track.artist.name}`"
          >
            <nz-list-item-meta-title>
              {{ `${track.title}` }}
            </nz-list-item-meta-title>
          </nz-list-item-meta>
          <ul nz-list-item-actions>
            <nz-list-item-action>
              <button nz-button nzType="default" nzShape="round" (click)="onRemoveTrack(track)">
                remove
              </button>
            </nz-list-item-action>
          </ul>
        </ng-container>
      </nz-list-item>
      @if (isLoading()) {
        <nz-list-item>
          <nz-skeleton [nzActive]="true" [nzAvatar]="true" [nzParagraph]="{ rows: 1 }" />
        </nz-list-item>
      }
    </nz-list>
  </cdk-virtual-scroll-viewport>

  <nz-input-wrapper>
    <nz-icon nzInputPrefix nzType="search" nzTheme="outline" />
    <input
      nz-input
      placeholder="Search your favourite songs"
      [ngModel]="searchValue()"
      (ngModelChange)="onSearchChange($event)"
    />
  </nz-input-wrapper>
  <app-search-results-card [playlistCreation]="true" (searchItem)="onAddSong($event)" />
</section>
