<section class="dashboard-section">
  <nz-input-wrapper>
    <nz-icon nzInputPrefix nzType="search" nzTheme="outline" />
    <input
      nz-input
      placeholder="Search your favourite songs"
      [(ngModel)]="searchValue"
      (ngModelChange)="search()"
    />
  </nz-input-wrapper>

  <cdk-virtual-scroll-viewport [itemSize]="25" class="example-viewport">
    <nz-list>
      @for (searchItem of searchItems(); track searchItem.id) {
        <nz-list-item>
          <nz-list-item-meta
            [nzAvatar]="searchItem.album.cover_small"
            [nzDescription]="searchItem.artist.name"
          >
            <nz-list-item-meta-title>
              {{ searchItem.artist.name }}
            </nz-list-item-meta-title>
          </nz-list-item-meta>
        </nz-list-item>
      }
    </nz-list>
  </cdk-virtual-scroll-viewport>
</section>
