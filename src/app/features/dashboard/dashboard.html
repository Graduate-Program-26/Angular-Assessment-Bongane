<section class="dashboard-section">
  <nz-input-wrapper>
    <nz-icon nzInputPrefix nzType="search" nzTheme="outline" />
    <input
      nz-input
      placeholder="Search your favourite songs"
      [ngModel]="searchValue()"
      (ngModelChange)="onSearchChange($event)"
    />
  </nz-input-wrapper>

  <cdk-virtual-scroll-viewport
    [itemSize]="72"
    class="example-viewport"
    (scrolledIndexChange)="onScrolledIndexChange($event)"
  >
    <nz-list>
      <nz-list-item *cdkVirtualFor="let searchItem of searchItems(); trackBy: trackById">
        <nz-list-item-meta
          [nzAvatar]="searchItem.album.cover_small"
          [nzDescription]="searchItem.artist.name"
        >
          <nz-list-item-meta-title>
            {{ searchItem.title }}
          </nz-list-item-meta-title>
        </nz-list-item-meta>
        <ul nz-list-item-actions>
          <nz-list-item-action>
            <a><nz-icon nzType="heart" nzTheme="outline" /></a>
            <a
              nz-popover
              [nzPopoverVisible]="activePopoverId() === searchItem.id"
              (click)="togglePopover(searchItem.id)"
              nzPopoverTrigger="click"
              [nzPopoverContent]="contentTemplate"
            >
              <nz-icon nzType="more" nzTheme="outline" />
            </a>

            <ng-template #contentTemplate>
              <div class="popover-template">
                <a (click)="closePopover(searchItem.id)">Close</a>
                <a>Add to playlist</a>
                <a>Create new playlist</a>
              </div>
            </ng-template>
          </nz-list-item-action>
        </ul>
      </nz-list-item>
      @if (isLoading()) {
        <nz-list-item>
          <nz-skeleton [nzActive]="true" [nzAvatar]="true" [nzParagraph]="{ rows: 1 }" />
        </nz-list-item>
      }
    </nz-list>
  </cdk-virtual-scroll-viewport>
</section>
